name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: make

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: librobloxfflags.so
