name: Build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Build
        run: make

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: librobloxfflags.so